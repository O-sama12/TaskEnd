services:
  db:
    image: postgres:15
    container_name: taskend_db

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5433:5432"

  web:
    build: .
    container_name: taskend_web

    command: gunicorn --chdir /app todo.wsgi:application --bind 0.0.0.0:8000

    volumes:
      - .:/app
      - static_volume:/static
      - media_volume:/media

    expose:
      - "8000"

    depends_on:
      - db

    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_HOST: ${DB_HOST}
      DB_PORT: 5432

  nginx:
    image: nginx:latest
    container_name: taskend_nginx

    ports:
      - "8080:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/static
      - media_volume:/media

    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume: